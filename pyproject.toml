[project]
name = "tribal-assistant"
version = "0.1.0"
description = "Tribal Wars assistant: account sync, build advisor, farm assistant, world map search — CLI, Python library and web dashboard."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Fernando Celmer", email = "fernandocelmer@gmail.com" }]
keywords = [
    "tribal-wars", "tribalwars", "guerra-tribal", "die-staemme", "browser-game",
    "game-assistant", "farm-assistant", "playwright", "fastapi", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.4",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "jinja2>=3.1.6",
    "anthropic>=1.9.0",
    "openai>=3.20.0",
]

[project.urls]
Homepage = "https://github.com/FernandoCelmer/tribal-assistant"
Repository = "https://github.com/FernandoCelmer/tribal-assistant"
Issues = "https://github.com/FernandoCelmer/tribal-assistant/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=2.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
tribal-assistant = "tribal_assistant.cli:main"
tribal-assistant-mcp = "tribal_assistant.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tribal_assistant*"]

[tool.setuptools.package-data]
tribal_assistant = ["web/templates/*.html", "web/templates/pages/*.html", "web/static/*", "web/static/js/*"]

[tool.poetry]
packages = [{ include = "tribal_assistant" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
