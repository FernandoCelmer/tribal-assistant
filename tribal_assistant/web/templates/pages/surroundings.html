{% extends "base.html" %}
{% block title %}Arredores · Tribal Assistant{% endblock %}
{% block content %}
  <section class="panel" id="surroundings" aria-labelledby="h-nearby">
    <div class="panel__header">
      <h1 class="panel__title" id="h-nearby"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-compass"/></svg>Arredores</h1>
      <span class="panel__meta" id="world-meta"></span>
      <div class="panel__actions">
        <label class="sr-only" for="village-select">Aldeia de origem</label>
        <select class="select" id="village-select" hidden></select>
        <div class="field"><label class="field__label" for="nearby-kind">Tipo</label>
          <select class="select" id="nearby-kind"><option value="barbarian">Bárbaras</option><option value="player">Jogadores</option><option value="all">Todas</option></select></div>
        <div class="field"><label class="field__label" for="nearby-radius">Raio</label>
          <select class="select" id="nearby-radius"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div>
      </div>
    </div>
    <div class="table-scroll" aria-label="Aldeias nos arredores">
      <table class="table">
        <thead><tr>
          <th scope="col">Aldeia</th><th scope="col">Coords</th><th scope="col" class="num">Pontos</th><th scope="col" class="num">Distância</th>
          <th scope="col">Dono</th><th scope="col" class="num">Lanceiro</th><th scope="col" class="num">Cav. leve</th><th scope="col"><span class="sr-only">Ações</span></th>
        </tr></thead>
        <tbody id="nearby"></tbody>
      </table>
    </div>
  </section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/surroundings.js"></script>{% endblock %}
