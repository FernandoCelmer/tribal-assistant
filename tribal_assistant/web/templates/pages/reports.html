{% extends "base.html" %}
{% block title %}Relatórios · Tribal Assistant{% endblock %}
{% block content %}
  <section class="panel" id="reports-panel" aria-labelledby="h-reports">
    <div class="panel__header">
      <h1 class="panel__title" id="h-reports"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-scroll"/></svg>Relatórios</h1>
      <span class="panel__meta" id="r-count"></span>
    </div>
    <div class="table-scroll" aria-label="Relatórios">
      <table class="table">
        <thead><tr><th scope="col"><span class="sr-only">Resultado</span></th><th scope="col">Assunto</th><th scope="col">Alvo</th><th scope="col">Recebido</th><th scope="col" class="num">Madeira</th><th scope="col" class="num">Argila</th><th scope="col" class="num">Ferro</th><th scope="col" class="num">Saque</th></tr></thead>
        <tbody id="reports"></tbody>
      </table>
    </div>
  </section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/reports.js"></script>{% endblock %}
