{% extends "base.html" %}
{% block title %}Farm · Tribal Assistant{% endblock %}
{% block content %}
  <section class="panel" id="farm" aria-labelledby="h-farm">
    <div class="panel__header">
      <h1 class="panel__title" id="h-farm"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-flag"/></svg>Farm</h1>
      <span class="panel__meta" id="t-count"></span>
      <div class="panel__actions">
        <button class="btn" id="btn-tick" type="button"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-swords"/></svg>Rodar saque agora</button>
      </div>
    </div>
    <div class="panel__body">
      <form class="form-row" id="target-form">
        <div class="field">
          <label class="field__label" for="f-coords">Coordenadas</label>
          <input class="input input--coords" id="f-coords" name="coords" placeholder="500|500" required pattern="\d{1,3}\|\d{1,3}" aria-describedby="f-coords-help">
          <span class="field__help" id="f-coords-help">Formato x|y</span>
        </div>
        <div class="field">
          <label class="field__label" for="f-template">Modelo</label>
          <select class="select" id="f-template" name="template"><option>A</option><option>B</option><option>C</option></select>
          <span class="field__help">Assistente de saque</span>
        </div>
        <div class="field">
          <label class="field__label" for="f-wall">Muralha</label>
          <input class="input input--short" id="f-wall" name="wall_level" type="number" min="0" max="20" value="0">
          <span class="field__help">Nível 0–20</span>
        </div>
        <div class="field">
          <button class="btn btn--primary" type="submit"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-plus"/></svg>Adicionar alvo</button>
          <span class="field__help">&nbsp;</span>
        </div>
      </form>
    </div>
    <div class="table-scroll" aria-label="Alvos de farm">
      <table class="table">
        <thead><tr>
          <th scope="col">Coords</th><th scope="col">Modelo</th><th scope="col" class="num">Muralha</th><th scope="col">Ativo</th>
          <th scope="col">Último ataque</th><th scope="col" class="num">Último saque</th>
        </tr></thead>
        <tbody id="targets"></tbody>
      </table>
    </div>
  </section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/farm.js"></script>{% endblock %}
