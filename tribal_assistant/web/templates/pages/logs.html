{% extends "base.html" %}
{% block title %}Logs · Tribal Assistant{% endblock %}
{% block content %}
  <section class="panel" id="logs" aria-labelledby="h-logs">
    <div class="panel__header">
      <h1 class="panel__title" id="h-logs"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-book"/></svg>Logs da aplicação</h1>
      <div class="panel__actions">
        <label class="sr-only" for="log-level">Nível mínimo</label>
        <select class="select" id="log-level">
          <option value="DEBUG">debug</option><option value="INFO" selected>info</option>
          <option value="WARNING">aviso</option><option value="ERROR">erro</option>
        </select>
        <label class="sr-only" for="log-search">Buscar</label>
        <input class="input" id="log-search" type="search" placeholder="buscar nos logs">
        <label class="check"><input type="checkbox" id="log-tail" checked> ao vivo</label>
      </div>
    </div>
    <div class="table-scroll" aria-label="Logs">
      <table class="table table--logs">
        <thead><tr><th scope="col">Quando</th><th scope="col">Nível</th><th scope="col">Mensagem</th><th scope="col">Origem</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
    <div class="panel__footer"><button class="btn btn--subtle btn--sm" type="button" id="logs-more">carregar mais antigos</button></div>
  </section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/logs.js"></script>{% endblock %}
